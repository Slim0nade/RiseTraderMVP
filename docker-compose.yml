version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: risetrader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risetrader}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risetrader2024}
      POSTGRES_HOST_AUTH_METHOD: md5
      # Performance tuning for development
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Mount for easy backup/restore access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-risetrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - risetrader

  # Redis for caching and pub/sub (ready for future use)
  redis:
    image: redis:7-alpine
    container_name: risetrader-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - risetrader

  # Development shell for testing and scripts
  dev:
    image: python:3.11-slim
    container_name: risetrader-dev
    working_dir: /app
    volumes:
      - .:/app
    command: sleep infinity
    network_mode: host  # Allows connection to MT4 on host network
    environment:
      - MT4_HOST=75.154.254.186
      - MT4_REP_PORT=5555
      - MT4_PUB_PORT=5556

  # MLflow Tracking Server for ML/RL model registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: risetrader-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-risetrader2024}@postgres:5432/${POSTGRES_DB:-risetrader}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-risetrader2024}@postgres:5432/${POSTGRES_DB:-risetrader}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - risetrader
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for local LLM inference (Qwen3-14B, DeepSeek-R1-14B)
  # DISABLED: Using external Ollama instance at 192.168.0.123:11434
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: risetrader-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   networks:
  #     - risetrader
  #   # Note: Models already pulled on external machine:
  #   # - qwen3:14b
  #   # - deepseek-r1:14b

  # FastAPI service
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.simple
    container_name: risetrader-api
    restart: unless-stopped
    # network_mode: host  # Disabled - doesn't work on macOS Docker Desktop
    ports:
      - "${API_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # mlflow:
      #   condition: service_healthy  # Disabled temporarily - port 5000 conflict
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-risetrader2024}@postgres:5432/${POSTGRES_DB:-risetrader}
      REDIS_URL: redis://redis:6379
      MLFLOW_TRACKING_URI: http://localhost:5000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://75.154.254.186:11434}
      MT4_HOST: ${MT4_HOST:-75.154.254.186}
      MT4_REP_PORT: ${MT4_REP_PORT:-5555}
      MT4_PUB_PORT: ${MT4_PUB_PORT:-5556}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ENABLED: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    networks:
      - risetrader
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    name: risetrader_postgres_data
  redis_data:
    name: risetrader_redis_data
  mlflow_artifacts:
    name: risetrader_mlflow_artifacts
  # ollama_models:  # Not needed - using external Ollama instance
  #   name: risetrader_ollama_models

networks:
  risetrader:
    name: risetrader_network
    driver: bridge
