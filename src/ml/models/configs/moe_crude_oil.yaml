# Mixture of Experts for Crude Oil Regime-Adaptive Forecasting
# Based on research: 17-33% error reduction over dense models

model:
  name: "moe_crude_oil"
  type: "moe"
  
  # Expert configuration
  num_experts: 8
  top_k: 2           # Activate 2 experts per sample
  expert_hidden_size: 128
  expert_type: "gru"  # "gru", "tcn", "transformer"
  use_shared_expert: true  # One expert always active
  
  # Routing strategy
  router_type: "volatility"  # "learned", "volatility", "regime"
  load_balancing_weight: 0.01  # Auxiliary loss for balanced usage

features:
  lookback_window: 30
  prediction_length: 5
  
  price_features: ["open", "high", "low", "close", "volume"]
  technical_indicators:
    - rsi_14
    - macd
    - atr
    - bb_width
    - volatility_20
  exogenous_variables:
    - dxy
    - vix
    - ovx

training:
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 15
  optimizer: "adam"
  loss_function: "mse"
  gradient_clip: 1.0
  
  scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5

data:
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  normalization: "z-score"
  
  walk_forward:
    enabled: true
    train_window: 252
    test_window: 21
    step_size: 21
