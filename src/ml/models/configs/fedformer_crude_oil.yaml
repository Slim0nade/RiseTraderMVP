# FEDformer Configuration for Crude Oil Weekly/Monthly Forecasting
# Based on research: 38.5% MAE reduction vs LSTM, 56.6% vs GRU

model:
  name: "fedformer_crude_oil_weekly"
  type: "fedformer"
  
  # Architecture
  d_model: 256
  n_heads: 8
  e_layers: 2          # Encoder layers
  d_layers: 1          # Decoder layers
  d_ff: 512            # Feed-forward dimension
  dropout: 0.1
  activation: "gelu"
  
  # Frequency components (key innovation)
  modes: 32            # Number of Fourier modes to keep
  mode_select: "random"  # 'random' or 'low'
  
  # Decomposition
  moving_avg: 25       # Window for moving average decomposition

features:
  lookback_window: 60  # 60 days for long-horizon
  prediction_length: 14  # 2-week forecast
  
  price_features: ["open", "high", "low", "close", "volume"]
  technical_indicators:
    - rsi_14
    - macd
    - macd_signal
    - atr
    - bb_width
    - volatility_20
  exogenous_variables:
    - dxy
    - vix
    - ovx
    - gold_price     # Cross-commodity correlation
    - nat_gas_price  # Energy complex correlation

training:
  learning_rate: 0.0001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 15
  optimizer: "adamw"
  weight_decay: 0.01
  loss_function: "mse"
  gradient_clip: 1.0
  
  scheduler:
    type: "cosine_annealing"
    T_max: 100

data:
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  normalization: "z-score"
  
  walk_forward:
    enabled: true
    train_window: 504  # 2 years
    test_window: 63    # 3 months
    step_size: 63      # Quarterly retraining
