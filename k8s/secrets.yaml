# ============================================================================
# RiseTrader Secrets
# IMPORTANT: This is a template. Use kubectl create secret or sealed-secrets
# DO NOT commit actual secrets to version control!
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: risetrader-secrets
  namespace: risetrader
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME@postgres:5432/risetrader"

  # Redis credentials
  REDIS_PASSWORD: "CHANGE_ME"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"

  # Security
  JWT_SECRET_KEY: "CHANGE_ME"
  API_KEY: "CHANGE_ME"

  # ZMQ Encryption
  ZMQ_CLIENT_SECRET_KEY: "CHANGE_ME"
  ZMQ_CLIENT_PUBLIC_KEY: "CHANGE_ME"
  ZMQ_SERVER_PUBLIC_KEY: "CHANGE_ME"

  # Grafana
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"

---
# Create secrets using kubectl:
#
# kubectl create secret generic risetrader-secrets \
#   --from-literal=POSTGRES_PASSWORD=xxx \
#   --from-literal=DATABASE_URL=xxx \
#   --from-literal=REDIS_PASSWORD=xxx \
#   --from-literal=REDIS_URL=xxx \
#   --from-literal=JWT_SECRET_KEY=xxx \
#   --from-literal=API_KEY=xxx \
#   --from-literal=ZMQ_CLIENT_SECRET_KEY=xxx \
#   --from-literal=ZMQ_CLIENT_PUBLIC_KEY=xxx \
#   --from-literal=ZMQ_SERVER_PUBLIC_KEY=xxx \
#   --from-literal=GRAFANA_ADMIN_PASSWORD=xxx \
#   --namespace=risetrader
