# ============================================================================
# RiseTrader Ingress Configuration
# Requires ingress-nginx controller
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risetrader-ingress
  namespace: risetrader
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  tls:
  - hosts:
    - risetrader.yourdomain.com
    secretName: risetrader-tls
  rules:
  - host: risetrader.yourdomain.com
    http:
      paths:
      # API endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      # Metrics endpoint
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      # Grafana
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      # Prometheus
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
      # Dashboard (default)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 80
