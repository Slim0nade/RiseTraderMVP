[pytest]
# Pytest configuration for Phase 6 intelligent agent testing

# Test paths
testpaths = tests

# Python files
python_files = test_*.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (real LLM calls, database)
    slow: Slow tests (may take >10 seconds)
    real_data: Tests using real historical data from database
    mock: Tests using mocked data
    phase6: Phase 6 adversarial debate tests
    debate: Risk tolerance debate tests
    approval: Fund manager approval tests

# Async support
asyncio_mode = auto

# Output
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__
