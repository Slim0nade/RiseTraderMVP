# ============================================================================
# RiseTrader PostgreSQL Configuration
# Production-optimized settings for time-series trading data
# ============================================================================

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# Memory Settings (adjust based on server RAM)
# For 8GB RAM server
# -----------------------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 64MB

# -----------------------------------------------------------------------------
# Write-Ahead Log (WAL) Settings
# -----------------------------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# -----------------------------------------------------------------------------
# Query Planning
# -----------------------------------------------------------------------------
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

# Log slow queries
log_min_duration_statement = 1000  # Log queries taking > 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# -----------------------------------------------------------------------------
# Query Statistics
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# -----------------------------------------------------------------------------
# Time Zone
# -----------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'

# -----------------------------------------------------------------------------
# Locale and Formatting
# -----------------------------------------------------------------------------
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# -----------------------------------------------------------------------------
# Performance Optimizations for Time-Series Data
# -----------------------------------------------------------------------------
# Autovacuum settings (important for high-write workloads)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# -----------------------------------------------------------------------------
# Connection Pooling Compatibility (for PgBouncer if used)
# -----------------------------------------------------------------------------
max_prepared_transactions = 0
track_activities = on
track_counts = on

# -----------------------------------------------------------------------------
# Time-Series Specific Settings
# -----------------------------------------------------------------------------
# Increase batch size for COPY operations (for bulk data loads)
# shared_preload_libraries = 'timescaledb'  # If using TimescaleDB
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
ssl = off  # Enable in production with proper certificates
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'
password_encryption = scram-sha-256
