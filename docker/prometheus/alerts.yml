# ============================================================================
# Prometheus Alert Rules for RiseTrader
# Critical alerts for trading system health
# ============================================================================

groups:
  # ===========================================================================
  # Application Alerts
  # ===========================================================================
  - name: risetrader_application
    interval: 30s
    rules:
      - alert: APIServiceDown
        expr: up{job="risetrader-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "RiseTrader API is down"
          description: "API service has been down for more than 1 minute"

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is above 1 second: {{ $value }}s"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5%: {{ $value | humanizePercentage }}"

  # ===========================================================================
  # Trading Alerts
  # ===========================================================================
  - name: risetrader_trading
    interval: 30s
    rules:
      - alert: TradingAgentFailed
        expr: agent_status{status="failed"} == 1
        for: 1m
        labels:
          severity: critical
          component: agents
        annotations:
          summary: "Trading agent has failed"
          description: "Agent {{ $labels.agent_name }} has failed"

      - alert: HighDailyLoss
        expr: daily_pnl < -500
        for: 5m
        labels:
          severity: critical
          component: risk
        annotations:
          summary: "High daily loss detected"
          description: "Daily P&L is below -$500: ${{ $value }}"

      - alert: MaxPositionsReached
        expr: open_positions >= 5
        for: 5m
        labels:
          severity: warning
          component: risk
        annotations:
          summary: "Maximum open positions reached"
          description: "Open positions: {{ $value }}"

      - alert: MT4ConnectionLost
        expr: mt4_connection_status == 0
        for: 2m
        labels:
          severity: critical
          component: execution
        annotations:
          summary: "MT4 connection lost"
          description: "Connection to MT4 server has been lost for 2 minutes"

  # ===========================================================================
  # Infrastructure Alerts
  # ===========================================================================
  - name: risetrader_infrastructure
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90%: {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%: {{ $value }}%"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%: {{ $value }}%"

  # ===========================================================================
  # ML Model Alerts
  # ===========================================================================
  - name: risetrader_ml
    interval: 60s
    rules:
      - alert: ModelPredictionErrors
        expr: rate(ml_prediction_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "High ML prediction error rate"
          description: "ML prediction error rate is above 10%: {{ $value | humanizePercentage }}"

      - alert: SlowModelInference
        expr: histogram_quantile(0.95, rate(ml_inference_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "Slow ML inference time"
          description: "95th percentile inference time is above 500ms: {{ $value }}s"
