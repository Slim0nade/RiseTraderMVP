# ============================================================================
# Logstash Pipeline Configuration
# Collects logs from RiseTrader services
# ============================================================================

input {
  # File input - read application logs
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "application"
    tags => ["risetrader"]
  }

  # File input - read nginx logs
  file {
    path => "/logs/nginx/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx"
    tags => ["risetrader", "nginx"]
  }
}

filter {
  # Parse application logs (JSON format)
  if [type] == "application" {
    json {
      source => "message"
    }

    # Add timestamp
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
    }

    # Extract log level
    if [level] {
      mutate {
        lowercase => ["level"]
      }
    }
  }

  # Parse nginx access logs
  if [type] == "nginx" and [path] =~ "access" {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{DATA:path} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{DATA:http_referer}" "%{DATA:http_user_agent}"'
      }
    }

    date {
      match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }

    mutate {
      convert => {
        "status" => "integer"
        "body_bytes_sent" => "integer"
      }
    }
  }

  # Add service identification
  mutate {
    add_field => {
      "service" => "risetrader"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["host", "agent"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "risetrader-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug output (optional)
  # stdout {
  #   codec => rubydebug
  # }
}
